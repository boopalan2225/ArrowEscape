<?xml version="1.0" encoding="UTF-8"?>
<!--
  Original sample shape - verification content for the SVG-authoring
  pipeline (Stage 7), not a copy of any reference illustration.

  Built mostly from <ellipse>/<circle> on purpose: the cat silhouette taught
  that hand-picked bezier landmarks are easy to get subtly wrong (two
  self-intersections, caught only by actually checking). A fish shape is
  naturally just a body ellipse, a tail wedge and a couple of fin wedges, so
  there's no reason to risk freehand curves where simple primitives will do.

  Colours are chosen to sit far from the board's near-black background
  (#1A1A1A) - panda.svg's #28232D body nearly vanishing into it is exactly
  the mistake this file avoids.
-->
<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">

  <!-- Tail, drawn first so the body overlaps its base seam. -->
  <path id="tail" fill="#FF6F3C" d="M70 130 L5 70 L25 130 L5 190 Z"/>

  <!-- Top and bottom fins. -->
  <path id="finTop" fill="#FFC23C" d="M150 65 L190 15 L220 80 Z"/>
  <path id="finBottom" fill="#FFC23C" d="M150 195 L190 245 L220 180 Z"/>

  <!-- Body. -->
  <ellipse id="body" cx="230" cy="130" rx="150" ry="85" fill="#2DD4BF"/>

  <!-- A contrasting belly stripe. -->
  <path id="belly" fill="#F2FFFB" d="M150 160 Q230 195 330 160 Q320 190 230 205 Q140 190 150 160 Z"/>

  <!-- Side stripes, a decorative accent band. -->
  <path id="stripe" fill="#0E9B8A" d="M210 55 Q225 130 210 205 Q195 130 210 55 Z"/>

  <!-- Eye: a white circle with a black pupil, small enough that the dark
       pupil reads as a detail rather than vanishing into the background. -->
  <circle id="eyeWhite" cx="320" cy="105" r="22" fill="#FFFFFF"/>
  <circle id="eyePupil" cx="326" cy="103" r="11" fill="#3D1A4E"/>
  <circle id="eyeHighlight" cx="330" cy="98" r="4" fill="#FFFFFF"/>

  <!-- Mouth: a simple stroked line, drawn as a line on purpose. -->
  <path id="mouth" fill="none" stroke="#0E9B8A" stroke-width="5" stroke-linecap="round"
      d="M355 125 Q365 135 352 145"/>

</svg>
